<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Daftar Leads — Leads &amp; Prospek Management</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <!-- ============================= SIDEBAR ============================= -->
  <aside class="sidebar" id="sidebar">
    <button class="sidebar__collapse-btn" id="sidebarCollapseBtn" title="Ciutkan / perluas menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="sidebar__brand">
      <div class="sidebar__brand-mark">LP</div>
      <div class="sidebar__brand-text">
        <h1>Leads &amp; Prospek</h1>
        <span>Management System</span>
      </div>
    </div>
    <nav class="sidebar__nav">
      <div class="sidebar__section-label">Dashboard</div>
      <a href="dashboard-tier1.html" class="side-link" data-key="dashboard-tier1" title="Dashboard SSM Tier 1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V10M10 19V4M16 19v-6M4 19h16"/></svg>
        <span class="side-link__text">Dashboard SSM Tier 1</span>
      </a>
      <a href="dashboard-tier2.html" class="side-link" data-key="dashboard-tier2" title="Dashboard SSM Tier 2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V10M10 19V4M16 19v-6M4 19h16"/></svg>
        <span class="side-link__text">Dashboard SSM Tier 2</span>
      </a>
      <div class="sidebar__section-label">Transaksi</div>
      <a href="leads-list.html" class="side-link" data-key="leads-list" title="Transaksi Leads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span class="side-link__text">Transaksi Leads</span> <span class="count-pill" id="sideCountLeads">0</span>
      </a>
      <a href="prospects-list.html" class="side-link" data-key="prospects-list" title="Transaksi Prospek">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
        <span class="side-link__text">Transaksi Prospek</span> <span class="count-pill" id="sideCountProspects">0</span>
      </a>
      <div class="sidebar__section-label">Report</div>
      <a href="report-leads.html" class="side-link" data-key="report-leads" title="Laporan Leads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
        <span class="side-link__text">Laporan Leads</span>
      </a>
      <a href="report-prospects.html" class="side-link" data-key="report-prospects" title="Laporan Prospek">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
        <span class="side-link__text">Laporan Prospek</span>
      </a>
    </nav>
    <div class="sidebar__foot">
      <div class="app-clock" id="appClock"><b>-</b></div>
    </div>
  </aside>

  <!-- ============================= CONTENT ============================= -->
  <div class="app-content">
    <main class="app-main">

      <div class="page-head">
        <div>
          <h2 class="page-head__title">Laporan Daftar Leads</h2>
          <p class="page-head__desc">Filter data Leads terlebih dahulu, lalu cetak sebagai PDF atau unduh sebagai Excel.</p>
        </div>
      </div>

      <div class="filter-panel">
        <div class="filter-grid">
          <div class="filter-field"><label>Periode Dari</label><input type="date" id="rlFrom"></div>
          <div class="filter-field"><label>Periode Sampai</label><input type="date" id="rlTo"></div>
          <div class="filter-field"><label>Product Group</label><select id="rlGroup"></select></div>
          <div class="filter-field"><label>Product Brand</label><select id="rlBrand"></select></div>
          <div class="filter-field"><label>Product Model</label><select id="rlModel"></select></div>
          <div class="filter-field"><label>PIC Name</label><select id="rlPic"></select></div>
          <div class="filter-field"><label>Leads Source</label><select id="rlSource"></select></div>
          <div class="filter-field"><label>Leads Rating</label><select id="rlRating"></select></div>
          <div class="filter-field"><label>PQL</label><select id="rlPql"></select></div>
          <div class="filter-field"><label>QQL</label><select id="rlQql"></select></div>
          <div class="filter-field span-2"><label>Cari Customer / Nomor Bukti</label><input type="text" id="rlSearch" placeholder="Nama customer atau nomor bukti…"></div>
        </div>
        <div class="filter-actions">
          <button class="btn btn-ghost btn-sm" id="rlReset">Reset Filter</button>
          <div class="spacer"></div>
          <button class="btn btn-outline" id="rlExportExcel">⬇️ Download Excel</button>
          <button class="btn btn-primary" id="rlPrintPdf">🖨️ Cetak PDF</button>
        </div>
      </div>

      <div class="report-summary" id="rlSummary"></div>

    </main>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="common.js"></script>
<script src="report-leads.js"></script>
</body>
</html>
